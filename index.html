<title>כוח אדם · פלגה 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one column of stacked roster ledgers under a tab bar; each soldier row unfolds into a requests sub-ledger. */
:root {
  --bg: #f1f2ec; --surface: #fbfbf8; --fg: #1d2119; --muted: #646b5c; --line: #d8dbcd;
  --accent: #4b5a26; --accent-soft: #e3e8d3; --warn: #a94b18; --warn-soft: #f6e3d6; --ok: #3d6b3a;
  --f-display: "Secular One", "Heebo", system-ui, sans-serif;
  --f-body: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14160f; --surface: #1c1f15; --fg: #e6e8dd; --muted: #9ca28e; --line: #343a2a;
  --accent: #b8c77c; --accent-soft: #2b3220; --warn: #e5915e; --warn-soft: #3a2619; --ok: #8fc48a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14160f; --surface: #1c1f15; --fg: #e6e8dd; --muted: #9ca28e; --line: #343a2a;
  --accent: #b8c77c; --accent-soft: #2b3220; --warn: #e5915e; --warn-soft: #3a2619; --ok: #8fc48a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 22px }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance }
h1 { font-size: 1.75rem; line-height: 1.2 }
h2 { font-size: 1.2rem }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px }
.period { color: var(--muted); font-size: .95rem }
.period b { font-family: var(--f-mono); font-weight: 500; color: var(--fg) }
.status { font-size: .82rem; color: var(--muted); min-height: 1.2em }
.status.err { color: var(--warn) }
.status.ok { color: var(--ok) }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line) }
.tab { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; color: var(--muted); cursor: pointer; margin-bottom: -1px }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-block: 2px }
.stat { display: grid; gap: 0 }
.stat .n { font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums }
.stat .l { font-size: .78rem; color: var(--muted); letter-spacing: .02em }

section.team { display: grid; gap: 8px }
.team-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px }
.team-head .meta { color: var(--muted); font-size: .85rem }
.team.command .ledger { border-color: var(--accent) }
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto }
table { width: 100%; border-collapse: collapse; min-width: 720px }
th { text-align: start; font-weight: 500; font-size: .78rem; color: var(--muted); letter-spacing: .03em; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr.soldier:last-of-type td, tr.detail:last-child td { border-bottom: 0 }
tr.soldier.open > td { background: var(--accent-soft) }
col.c-tog { width: 76px } col.c-name { width: 22% } col.c-role { width: 17% } col.c-ma { width: 110px } col.c-req { width: 92px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

.rowctl { display: flex; align-items: center; gap: 4px }
.grip { width: 26px; height: 28px; border: 0; background: none; color: var(--muted); cursor: grab; display: grid; place-items: center; padding: 0; border-radius: 4px; touch-action: none }
.grip:hover { color: var(--fg); background: var(--accent-soft) }
.grip:active { cursor: grabbing }
tr.dragging > td { opacity: .45 }
tr.drop-before > td { box-shadow: inset 0 3px 0 var(--accent) }
tr.drop-after > td { box-shadow: inset 0 -3px 0 var(--accent) }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none }

.tog { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; padding: 0 }
.tog svg { transition: transform .15s }
tr.open .tog svg { transform: rotate(-90deg) }
.tog:focus-visible, .btn:focus-visible, .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }

input.cell, textarea.cell { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; width: 100% }
input.cell:hover:not(:disabled), textarea.cell:hover:not(:disabled) { border-color: var(--line) }
input.cell:focus, textarea.cell:focus { outline: none; border-color: var(--accent); background: var(--surface) }
input.cell.name { font-weight: 500 }
input.cell.ma { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; text-align: right }
input.cell::placeholder, textarea.cell::placeholder { color: var(--muted); opacity: .7 }
.boxed { border-color: var(--line) !important; background: var(--surface) !important }

.quals { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; cursor: text; border: 1px solid transparent; border-radius: 4px; padding: 3px 4px }
.quals:hover { border-color: var(--line) }
.chip { font-size: .78rem; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); white-space: nowrap }
.quals .empty { color: var(--muted); font-size: .82rem; opacity: .7 }

.reqcount { font-family: var(--f-mono); font-size: .8rem; padding: 1px 8px; border-radius: 10px; white-space: nowrap }
.reqcount.has { background: var(--warn-soft); color: var(--warn) }
.reqcount.none { color: var(--muted) }

tr.detail > td { background: var(--accent-soft); padding: 4px 12px 14px 12px }
.panel { display: grid; gap: 10px; padding-inline-start: 76px }
.reqs { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: grid }
.reqs-head { display: grid; grid-template-columns: minmax(15em, 2fr) 3fr auto; gap: 12px; padding: 6px 12px; font-size: .78rem; color: var(--muted); border-bottom: 1px solid var(--line) }
.req { display: grid; grid-template-columns: minmax(15em, 2fr) 3fr auto; gap: 6px 12px; padding: 8px 12px; align-items: start; border-bottom: 1px solid var(--line) }
.req:last-child { border-bottom: 0 }
.req .dates { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap }
.req .days { display: block; font-family: var(--f-mono); font-size: .76rem; color: var(--muted) }
.req .reason { white-space: pre-wrap; overflow-wrap: anywhere }
.req .reason.empty { color: var(--muted) }
.req .ops { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end }
.req.form { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent) }
.req.form .range { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.req.form input[type=date] { width: 9.8em; font-variant-numeric: tabular-nums }
.req.form .err { grid-column: 1 / -1; color: var(--warn); font-size: .84rem; min-height: 0 }
.req.form .ops { align-self: end }
textarea.cell { resize: vertical; min-height: 34px; line-height: 1.4 }
.empty-req { color: var(--muted); font-size: .88rem; padding: 10px 12px }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px }
.btn { font: inherit; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; padding: 4px 12px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
.btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 500 }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500 }
.btn.danger { color: var(--warn) }
.btn.danger:hover { border-color: var(--warn) }
.btn.small { font-size: .8rem; padding: 2px 9px }
.actions select { font: inherit; font-size: .88rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px }
.actions .lbl { font-size: .85rem; color: var(--muted) }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--warn) }
.addrow { padding: 8px }
.ro input.cell, .ro textarea.cell { pointer-events: none }

.placeholder, .loading { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 36px 20px; text-align: center; color: var(--muted) }
@media (max-width: 640px) {
  .panel { padding-inline-start: 0 } h1 { font-size: 1.4rem }
  .reqs-head { display: none }
  .req { grid-template-columns: 1fr }
  .req .ops { justify-content: start }
}
@media (prefers-reduced-motion: reduce) { .tog svg { transition: none } }
</style>

<script>
const PERIOD = { from: "2026-11-01", to: "2026-12-31" };
const DEFAULT_ROLE = "תותחן";
const TEAMS = [
  { key: "command", title: "" },
  { key: "2א", title: "צוות 2א" },
  { key: "2ב", title: "צוות 2ב" },
  { key: "2ג", title: "צוות 2ג" },
];
const state = { soldiers: new Map(), open: new Set(), editingQuals: null, confirm: null, draft: null, confirmReq: null, canWrite: true, ready: false };
let db = null, col = null, pendingRender = false, drag = null;

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  document.getElementById("view-roster").hidden = t.dataset.tab !== "roster";
  document.getElementById("view-two").hidden = t.dataset.tab !== "two";
  try { localStorage.setItem("p2tab", t.dataset.tab) } catch (e) {}
}));
try { const t = localStorage.getItem("p2tab"); if (t) document.querySelector(`.tab[data-tab="${t}"]`)?.click() } catch (e) {}

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const fmt = iso => iso ? iso.split("-").reverse().join(".") : "";
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5) + 1;
const uid = () => Math.random().toString(36).slice(2, 10);
let statusTimer = null;
function setStatus(text, kind) {
  const s = document.getElementById("status"); s.textContent = text;
  s.classList.toggle("err", kind === true || kind === "err"); s.classList.toggle("ok", kind === "ok");
  clearTimeout(statusTimer); if (kind === "ok") statusTimer = setTimeout(() => { s.textContent = ""; s.className = "status" }, 3000);
}
const roleOf = s => s.role || DEFAULT_ROLE;
const GRIP = '<svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><g fill="currentColor"><circle cx="3.5" cy="3" r="1.4"/><circle cx="8.5" cy="3" r="1.4"/><circle cx="3.5" cy="8" r="1.4"/><circle cx="8.5" cy="8" r="1.4"/><circle cx="3.5" cy="13" r="1.4"/><circle cx="8.5" cy="13" r="1.4"/></g></svg>';
const CHEV = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- persistence: one write at a time per soldier ---------- */
const queues = new Map();
function save(id, okText) {
  const s = state.soldiers.get(id); if (!s || !col) return;
  const body = JSON.parse(JSON.stringify(s)); delete body.id;
  const prev = queues.get(id) || Promise.resolve();
  const p = prev.then(() => col.doc(id).set(body)).then(() => {
    if (queues.get(id) === p) setStatus(okText || "נשמר", "ok");
  }).catch(e => {
    if (e && e.code === "invalid_argument") { state.canWrite = false; render() }
    setStatus(e && e.code === "quota_exceeded" ? "אין מקום לשמור נתונים נוספים." : "השמירה נכשלה. רעננו את הדף ונסו שוב.", "err");
  });
  queues.set(id, p);
}
function removeDoc(id) {
  state.soldiers.delete(id); state.open.delete(id); render();
  if (col) col.doc(id).delete().then(() => setStatus("החייל הוסר", "ok")).catch(() => setStatus("ההסרה נכשלה.", "err"));
}

/* ---------- render ---------- */
function sortedTeam(key) {
  return [...state.soldiers.values()].filter(s => s.team === key).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, "he"));
}
function busy() { const a = document.activeElement; return drag || (a && a.closest && a.closest("#roster") && a.matches("input,textarea,select")) }
function requestRender() { if (busy()) pendingRender = true; else render() }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !busy()) { pendingRender = false; render() } }, 0));

function render() {
  const root = document.getElementById("roster");
  document.getElementById("loading").hidden = state.ready;
  if (!state.ready) { root.replaceChildren(); return }
  root.classList.toggle("ro", !state.canWrite);
  const all = [...state.soldiers.values()];
  const reqs = all.flatMap(s => s.requests || []);
  const stats = h("div", { class: "stats" },
    stat(all.length, "סה\"כ בפלגה"),
    ...TEAMS.slice(1).map(t => stat(all.filter(s => s.team === t.key).length, t.title)),
    stat(all.filter(s => (s.requests || []).length).length, "חיילים עם בקשות"),
    stat(reqs.length, "בקשות היעדרות"),
  );
  root.replaceChildren(stats, ...TEAMS.map(teamSection));
}
function stat(n, l) { return h("div", { class: "stat" }, h("span", { class: "n" }, n), h("span", { class: "l" }, l)) }
function teamCount(n) { return n === 0 ? "אין חיילים" : n === 1 ? "מפקד" : `מפקד + ${n - 1} חיילים` }

function teamSection(t) {
  const list = sortedTeam(t.key);
  const withReq = list.filter(s => (s.requests || []).length).length;
  const tbody = h("tbody", { "data-team": t.key });
  for (const s of list) { tbody.append(soldierRow(s)); if (state.open.has(s.id)) tbody.append(detailRow(s)) }
  if (!list.length) tbody.append(h("tr", {}, h("td", { colspan: 6, class: "addrow", style: "color:var(--muted)" }, "אין חיילים בטבלה הזו.")));
  return h("section", { class: "team" + (t.key === "command" ? " command" : ""), "aria-label": t.title || "מפל\"ג וסמל" },
    t.title ? h("div", { class: "team-head" }, h("h2", {}, t.title),
      h("span", { class: "meta" }, teamCount(list.length), withReq ? ` · ${withReq} עם בקשות` : "")) : null,
    h("div", { class: "ledger" },
      h("table", {},
        h("colgroup", {}, ...["tog", "name", "role", "ma", "quals", "req"].map(c => h("col", { class: "c-" + c }))),
        h("thead", {}, h("tr", {}, h("th", {}, h("span", { class: "sr" }, "סידור ופתיחה")), h("th", {}, "שם החייל"), h("th", {}, "תפקיד"), h("th", {}, "מ.א"), h("th", {}, "הכשרות"), h("th", {}, "בקשות"))),
        tbody,
      ),
      state.canWrite && t.key !== "command" ? h("div", { class: "addrow" }, h("button", { class: "btn", onclick: () => addSoldier(t.key) }, "+ הוספת חייל")) : null,
    ),
  );
}

function field(s, key, cls, placeholder, fallback) {
  return h("input", { class: "cell " + cls, id: `f-${s.id}-${key}`, value: s[key] || fallback || "", placeholder, disabled: !state.canWrite, "aria-label": placeholder,
    onchange: e => { s[key] = e.target.value.trim() || fallback || ""; e.target.value = s[key]; save(s.id) },
    onkeydown: e => { if (e.key === "Enter") e.target.blur() } });
}

function soldierRow(s) {
  const open = state.open.has(s.id);
  const n = (s.requests || []).length;
  const qualsCell = state.editingQuals === s.id
    ? h("input", { class: "cell", id: `f-${s.id}-quals`, value: (s.quals || []).join(", "), placeholder: "הכשרות, מופרדות בפסיק", "aria-label": "הכשרות",
        onblur: e => { s.quals = e.target.value.split(",").map(x => x.trim()).filter(Boolean); state.editingQuals = null; save(s.id); setTimeout(render, 0) },
        onkeydown: e => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") { state.editingQuals = null; render() } } })
    : h("div", { class: "quals", tabindex: state.canWrite ? 0 : null, title: state.canWrite ? "לחצו לעריכה" : null,
        onclick: () => { if (!state.canWrite) return; state.editingQuals = s.id; render(); const i = document.getElementById(`f-${s.id}-quals`); i && i.focus() },

  return h("tr", { class: "soldier" + (open ? " open" : ""), "data-id": s.id },
    h("td", {}, h("div", { class: "rowctl" },

        onclick: () => { open ? state.open.delete(s.id) : state.open.add(s.id); state.confirm = null; if (open && state.draft?.sid === s.id) state.draft = null; render() } }))),
    h("td", {}, field(s, "name", "name", "שם החייל")),
    h("td", {}, field(s, "role", "", "תפקיד", DEFAULT_ROLE)),

    h("td", {}, qualsCell),
    h("td", {}, h("span", { class: "reqcount " + (n ? "has" : "none") }, n ? `${n} ${n === 1 ? "בקשה" : "בקשות"}` : "—")),
  );
}

/* ---------- reordering: drag the grip, or arrow keys on it ---------- */
function applyOrder(team, ids) {
  ids.forEach((id, i) => { const s = state.soldiers.get(id); if (s && s.order !== i) { s.order = i; save(id, "הסדר נשמר") } });
}
function keyMove(e, s) {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  e.preventDefault();
  const ids = sortedTeam(s.team).map(x => x.id), i = ids.indexOf(s.id), j = i + (e.key === "ArrowUp" ? -1 : 1);
  if (j < 0 || j >= ids.length) return;
  ids.splice(i, 1); ids.splice(j, 0, s.id); applyOrder(s.team, ids); render();

}
function startDrag(e, s) {

  e.preventDefault();

  const move = ev => {
    const rows = [...tbody.querySelectorAll("tr.soldier")].filter(r => r !== row);
    clear(); drag.target = null;
    if (!rows.length) return;
    let target = rows[rows.length - 1], after = true;
    for (const r of rows) { const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height / 2) { target = r; after = false; break } }
    drag.target = target; drag.after = after; target.classList.add(after ? "drop-after" : "drop-before");
    const vh = window.innerHeight; if (ev.clientY < 60) window.scrollBy(0, -12); else if (ev.clientY > vh - 60) window.scrollBy(0, 12);
  };

    const btn = row.querySelector(".grip");
    btn.removeEventListener("pointermove", move); btn.removeEventListener("pointerup", end); btn.removeEventListener("pointercancel", end);
    clear(); row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    const d = drag; drag = null;
    if (d.target) {
      const ids = sortedTeam(s.team).map(x => x.id).filter(id => id !== s.id);
      let i = ids.indexOf(d.target.dataset.id); if (d.after) i++;

    }
    render();
  };

  btn.addEventListener("pointermove", move); btn.addEventListener("pointerup", end); btn.addEventListener("pointercancel", end);
}

/* ---------- requests: saved lines + one draft form with confirm/cancel ---------- */
function openDraft(s, r) {
  state.draft = { sid: s.id, rid: r ? r.id : null, from: r?.from || "", to: r?.to || "", reason: r?.reason || "", err: "" };
  state.confirmReq = null; render();
  document.getElementById(`d-${s.id}-from`)?.focus();
}
function commitDraft(s) {
  const d = state.draft;
  if (!d.from || !d.to) d.err = "צריך לבחור תאריך התחלה ותאריך סיום.";
  else if (d.to < d.from) d.err = "תאריך הסיום לפני תאריך ההתחלה.";
  else if (d.from < PERIOD.from || d.to > PERIOD.to) d.err = "התאריכים צריכים להיות בתוך הקו, בין 01.11.2026 ל-31.12.2026.";
  else d.err = "";
  if (d.err) { const el = document.getElementById(`d-${s.id}-err`); if (el) el.textContent = d.err; return }
  const item = { id: d.rid || uid(), from: d.from, to: d.to, reason: d.reason.trim() };
  const list = (s.requests || []).filter(x => x.id !== item.id);
  list.push(item); list.sort((a, b) => a.from.localeCompare(b.from));
  s.requests = list; state.draft = null;
  save(s.id, d.rid ? "הבקשה עודכנה" : "הבקשה נוספה"); render();
}
function draftForm(s) {
  const d = state.draft;
  const date = (k, lbl) => h("input", { type: "date", class: "cell boxed", id: `d-${s.id}-${k}`, value: d[k], min: PERIOD.from, max: PERIOD.to, "aria-label": lbl,
    oninput: e => { d[k] = e.target.value; if (k === "from" && d.from && (!d.to || d.to < d.from)) { d.to = d.from; const t = document.getElementById(`d-${s.id}-to`); if (t) t.value = d.to } } });
  const keys = e => { if (e.key === "Escape") { state.draft = null; render() } if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) commitDraft(s) };
  return h("div", { class: "req form", onkeydown: keys },
    h("div", { class: "range" }, date("from", "מתאריך"), "–", date("to", "עד תאריך")),
    h("textarea", { class: "cell boxed", id: `d-${s.id}-reason`, rows: 2, placeholder: "למה החייל מבקש לא להיות", "aria-label": "סיבה",
      oninput: e => { d.reason = e.target.value } }, d.reason),
    h("div", { class: "ops" },
      h("button", { class: "btn solid", onclick: () => commitDraft(s) }, "אישור"),
      h("button", { class: "btn", onclick: () => { state.draft = null; render() } }, "ביטול")),
    h("div", { class: "err", id: `d-${s.id}-err`, role: "alert" }, d.err));
}
function reqLine(s, r) {
  const ops = !state.canWrite ? null : state.confirmReq === r.id
    ? h("span", { class: "confirm" }, "למחוק?",
        h("button", { class: "btn small danger", onclick: () => { s.requests = (s.requests || []).filter(x => x !== r); state.confirmReq = null; save(s.id, "הבקשה נמחקה"); render() } }, "מחיקה"),
        h("button", { class: "btn small", onclick: () => { state.confirmReq = null; render() } }, "ביטול"))
    : [h("button", { class: "btn small", onclick: () => openDraft(s, r) }, "עריכה"),
       h("button", { class: "btn small danger", onclick: () => { state.confirmReq = r.id; render() } }, "מחיקה")];
  return h("div", { class: "req" },
    h("div", {}, h("span", { class: "dates" }, `${fmt(r.from)} – ${fmt(r.to)}`), r.from && r.to ? h("span", { class: "days" }, `${daysBetween(r.from, r.to)} ימים`) : null),
    h("div", { class: "reason" + (r.reason ? "" : " empty") }, r.reason || "לא צוינה סיבה"),
    h("div", { class: "ops" }, ops));
}

function detailRow(s) {
  const reqs = s.requests || [];
  const d = state.draft && state.draft.sid === s.id ? state.draft : null;
  const lines = reqs.map(r => d && d.rid === r.id ? draftForm(s) : reqLine(s, r));
  if (d && !d.rid) lines.push(draftForm(s));
  const box = h("div", { class: "reqs" },
    h("div", { class: "reqs-head" }, h("span", {}, "בקשה (טווח תאריכים)"), h("span", {}, "סיבה"), h("span", {})),
    lines.length ? lines : h("div", { class: "empty-req" }, "אין בקשות היעדרות. החייל זמין לכל הקו."));

  const teamOpts = TEAMS.map(t => h("option", { value: t.key, selected: s.team === t.key }, t.title || "מפל\"ג וסמל"));
  const actions = state.canWrite ? h("div", { class: "actions" },
    d ? null : h("button", { class: "btn primary", onclick: () => openDraft(s, null) }, "+ הוספת בקשה"),
    h("span", { class: "lbl" }, "צוות:"),
    h("select", { id: `team-${s.id}`, "aria-label": "העברה לצוות", onchange: e => { s.team = e.target.value; s.order = Date.now(); save(s.id); render() } }, teamOpts),
    state.confirm === s.id
      ? h("span", { class: "confirm" }, `להסיר את ${s.name || "החייל"} מהרשימה?`,
          h("button", { class: "btn danger", onclick: () => { state.confirm = null; removeDoc(s.id) } }, "הסרה"),
          h("button", { class: "btn", onclick: () => { state.confirm = null; render() } }, "ביטול"))
      : h("button", { class: "btn danger", onclick: () => { state.confirm = s.id; render() } }, "הסרת חייל"),
  ) : null;
  return h("tr", { class: "detail" }, h("td", { colspan: 6 }, h("div", { class: "panel" }, box, actions)));
}

function addSoldier(team) {
  if (!col) return;
  const ref = col.doc();
  const order = Math.max(-1, ...sortedTeam(team).map(s => s.order ?? 0)) + 1;
  const s = { id: ref.id, team, order, name: "", role: DEFAULT_ROLE, ma: "", quals: [], requests: [] };
  state.soldiers.set(ref.id, s); state.open.add(ref.id); save(ref.id, "החייל נוסף"); render();
  document.getElementById(`f-${ref.id}-name`)?.focus();
}

/* ---------- offline mode: same interface as the shared store, kept in this browser ---------- */
const LS_KEY = "platoon2-soldiers-v1";
function localCollection(seed) {
  let data = null, listeners = [];
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null") } catch (e) {}
  if (!data) data = JSON.parse(JSON.stringify(seed || {}));
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(data)) } catch (e) { setStatus("הדפדפן חוסם שמירה. ייצאו גיבוי כדי לא לאבד שינויים.", "err") } };
  const snap = () => { const docs = Object.keys(data).sort().map(id => ({ id, data: () => data[id], metadata: { hasPendingWrites: false } })); return { docs, size: docs.length } };
  const emit = () => listeners.forEach(fn => fn(snap()));
  persist();
  return {
    doc(id) { id = id || "n" + Date.now().toString(36) + uid(); return { id,
      set: async body => { data[id] = JSON.parse(JSON.stringify(body)); persist(); emit() },
      delete: async () => { delete data[id]; persist(); emit() } } },
    onSnapshot(fn) { listeners.push(fn); setTimeout(() => fn(snap()), 0); return () => {} },
    replaceAll(next) { data = next; persist(); emit() },
    all: () => data,
  };
}
function hasLocal() { try { return !!localStorage.getItem(LS_KEY) } catch (e) { return false } }
async function decryptRoster(pass) {
  const enc = window.P2_ENC, b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(enc.iv) }, key, b(enc.ct))));
}
function openLocal() {
  if (window.P2_SEED || hasLocal()) return startLocal(window.P2_SEED || null);
  const box = document.getElementById("loading");
  if (!window.P2_ENC) { box.textContent = "אין נתונים להצגה."; return }
  const err = h("div", { style: "color:var(--warn);min-height:1.4em" });
  const pass = h("input", { type: "password", id: "unlock-pass", class: "cell", autocomplete: "current-password", style: "max-width:16em;border-color:var(--line);background:var(--bg)", "aria-label": "סיסמה" });
  const form = h("form", { style: "display:grid;gap:10px;justify-items:center", onsubmit: async e => {
      e.preventDefault(); err.textContent = "פותח…";
      try { startLocal(await decryptRoster(pass.value)) } catch (_) { err.textContent = "הסיסמה שגויה." }
    } },
    h("div", { style: "color:var(--fg);font-weight:500" }, "הנתונים מוצפנים. הקלידו את הסיסמה כדי לפתוח."),
    h("div", { style: "display:flex;gap:8px;flex-wrap:wrap;justify-content:center" }, pass, h("button", { class: "btn primary", type: "submit" }, "פתיחה")),
    err,
    h("div", { style: "font-size:.82rem" }, "אחרי הפתיחה הנתונים נשמרים בדפדפן הזה, ולא תצטרכו להקליד שוב."));
  box.replaceChildren(form); pass.focus();
}
function startLocal(seed) {
  col = localCollection(seed);
  document.getElementById("localbar").hidden = false;
  document.getElementById("btn-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(col.all(), null, 1)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: `platoon2-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove(); setStatus("קובץ הגיבוי ירד למחשב", "ok");
  });
  document.getElementById("file-import").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (typeof d !== "object" || Array.isArray(d)) throw 0;
      state.open.clear(); state.draft = null; col.replaceAll(d); setStatus("הגיבוי נטען", "ok") } catch (_) { setStatus("הקובץ לא נראה כמו גיבוי של הדשבורד.", "err") }
    e.target.value = "";
  });
  const slot = document.getElementById("reset-slot");
  const drawReset = ask => slot.replaceChildren(ask
    ? h("span", { class: "confirm" }, "למחוק את כל השינויים ולחזור לנתוני המצבה?",
        h("button", { class: "btn danger", onclick: () => {
          if (!seed) { try { localStorage.removeItem(LS_KEY) } catch (e) {} location.reload(); return }
          state.open.clear(); state.draft = null; col.replaceAll(JSON.parse(JSON.stringify(seed))); drawReset(false); setStatus("חזרנו לנתוני המצבה", "ok") } }, "איפוס"),
        h("button", { class: "btn", onclick: () => drawReset(false) }, "ביטול"))
    : h("button", { class: "btn danger", onclick: () => drawReset(true) }, "איפוס לנתוני המצבה"));
  drawReset(false);
  subscribe();
}

/* ---------- boot ---------- */
(async () => {
  if (!window.claude || !window.claude.use) return openLocal();
  const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!dbNs) {
    if (window.P2_SEED || window.P2_ENC) return openLocal();
    document.getElementById("loading").textContent = "אין גישה לנתוני הפלגה בתצוגה הזו. התחברו לחשבון ונסו שוב."; return;
  }
  db = dbNs; col = db.collection("soldiers");
  if (user) { try { const c = await user.can("data.write"); if (c === false) state.canWrite = false } catch (e) {} }
  subscribe();
})();

function subscribe() {
  col.onSnapshot(snap => {
    const next = new Map();
    for (const d of snap.docs) {
      const data = JSON.parse(JSON.stringify(d.data()));
      const local = state.soldiers.get(d.id);
      // keep this view's local copy while its own write is still in flight
      next.set(d.id, queues.has(d.id) && local && d.metadata.hasPendingWrites ? local : { id: d.id, ...data });
    }
    state.soldiers = next; state.ready = true;
    if (!snap.size) { document.getElementById("loading").textContent = "עדיין אין חיילים ברשימה."; document.getElementById("loading").hidden = false; return }
    requestRender();
  }, () => setStatus("החיבור לנתונים נותק. רעננו את הדף.", "err"));
}
