<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>כוח אדם · פלגה 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of stacked roster ledgers under a tab bar; each soldier row unfolds into a requests sub-ledger. */
:root {
  --bg: #f1f2ec; --surface: #fbfbf8; --fg: #1d2119; --muted: #646b5c; --line: #d8dbcd;
  --accent: #4b5a26; --accent-soft: #e3e8d3; --warn: #a94b18; --warn-soft: #f6e3d6; --ok: #2f6b2c; --ok-soft: #dcebd5;
  --f-display: "Secular One", "Heebo", system-ui, sans-serif;
  --f-body: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14160f; --surface: #1c1f15; --fg: #e6e8dd; --muted: #9ca28e; --line: #343a2a;
  --accent: #b8c77c; --accent-soft: #2b3220; --warn: #e5915e; --warn-soft: #3a2619; --ok: #8fc48a; --ok-soft: #1f3320; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14160f; --surface: #1c1f15; --fg: #e6e8dd; --muted: #9ca28e; --line: #343a2a;
  --accent: #b8c77c; --accent-soft: #2b3220; --warn: #e5915e; --warn-soft: #3a2619; --ok: #8fc48a; --ok-soft: #1f3320; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 22px }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance }
h1 { font-size: 1.75rem; line-height: 1.2 }
h2 { font-size: 1.2rem }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px }
.period { color: var(--muted); font-size: .95rem }
.period b { font-family: var(--f-mono); font-weight: 500; color: var(--fg) }
.status { font-size: .82rem; color: var(--muted); min-height: 1.2em }
.status.err { color: var(--warn) }
.status.ok { color: var(--ok) }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line) }
.tab { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; color: var(--muted); cursor: pointer; margin-bottom: -1px }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; padding-block: 2px }
.stat { display: grid; gap: 0 }
.stat .n { font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums }
.stat .l { font-size: .78rem; color: var(--muted); letter-spacing: .02em }

section.team { display: grid; gap: 8px }
.team-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px }
.team-head .meta { color: var(--muted); font-size: .85rem }
.team.command .ledger { border-color: var(--accent) }
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto }
table { width: 100%; border-collapse: collapse; min-width: 720px }
th { text-align: start; font-weight: 500; font-size: .78rem; color: var(--muted); letter-spacing: .03em; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr.soldier:last-of-type td, tr.detail:last-child td { border-bottom: 0 }
tr.soldier.open > td { background: var(--accent-soft) }
col.c-tog { width: 76px } col.c-name { width: 22% } col.c-role { width: 17% } col.c-ma { width: 110px } col.c-req { width: 92px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

.rowctl { display: flex; align-items: center; gap: 4px }
.grip { width: 26px; height: 28px; border: 0; background: none; color: var(--muted); cursor: grab; display: grid; place-items: center; padding: 0; border-radius: 4px; touch-action: none }
.grip:hover { color: var(--fg); background: var(--accent-soft) }
.grip:active { cursor: grabbing }
tr.dragging > td { opacity: .45 }
tr.drop-before > td { box-shadow: inset 0 3px 0 var(--accent) }
tr.drop-after > td { box-shadow: inset 0 -3px 0 var(--accent) }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none }

.tog { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; padding: 0 }
.tog svg { transition: transform .15s }
tr.open .tog svg { transform: rotate(-90deg) }
.tog:focus-visible, .btn:focus-visible, .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }

input.cell, textarea.cell { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; width: 100% }
input.cell:hover:not(:disabled), textarea.cell:hover:not(:disabled) { border-color: var(--line) }
input.cell:focus, textarea.cell:focus { outline: none; border-color: var(--accent); background: var(--surface) }
input.cell.name { font-weight: 500 }
input.cell.ma { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; text-align: right }
input.cell::placeholder, textarea.cell::placeholder { color: var(--muted); opacity: .7 }
.boxed { border-color: var(--line) !important; background: var(--surface) !important }

.quals { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; align-items: center; cursor: text; border: 1px solid transparent; border-radius: 4px; padding: 3px 4px }
.quals:hover { border-color: var(--line) }
.chip { font-size: .78rem; padding: 1px 7px; border-radius: 3px; border: 1px solid var(--line); white-space: nowrap }
.quals .empty { color: var(--muted); font-size: .82rem; opacity: .7 }

.reqcount { font-family: var(--f-mono); font-size: .8rem; padding: 1px 8px; border-radius: 10px; white-space: nowrap }
.reqcount.has { background: var(--warn-soft); color: var(--warn) }
.reqcount.none { color: var(--muted) }

tr.detail > td { background: var(--accent-soft); padding: 4px 12px 14px 12px }
.panel { display: grid; gap: 10px; padding-inline-start: 76px }
.reqs { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; display: grid }
.reqs-head { display: grid; grid-template-columns: minmax(15em, 2fr) 3fr auto; gap: 12px; padding: 6px 12px; font-size: .78rem; color: var(--muted); border-bottom: 1px solid var(--line) }
.req { display: grid; grid-template-columns: minmax(15em, 2fr) 3fr auto; gap: 6px 12px; padding: 8px 12px; align-items: start; border-bottom: 1px solid var(--line) }
.req:last-child { border-bottom: 0 }
.req .dates { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap }
.req .days { display: block; font-family: var(--f-mono); font-size: .76rem; color: var(--muted) }
.req .reason { white-space: pre-wrap; overflow-wrap: anywhere }
.req .reason.empty { color: var(--muted) }
.req .ops { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end }
.req.form { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent) }
.req.form .range { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px }
.req.form input[type=date] { width: 9.8em; font-variant-numeric: tabular-nums }
.req.form .err { grid-column: 1 / -1; color: var(--warn); font-size: .84rem; min-height: 0 }
.req.form .ops { align-self: end }
textarea.cell { resize: vertical; min-height: 34px; line-height: 1.4 }
.empty-req { color: var(--muted); font-size: .88rem; padding: 10px 12px }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px }
.btn { font: inherit; font-size: .88rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; padding: 4px 12px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn:disabled { opacity: .5; cursor: default }
.btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 500 }
.btn.solid { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 500 }
.btn.danger { color: var(--warn) }
.btn.danger:hover { border-color: var(--warn) }
.btn.small { font-size: .8rem; padding: 2px 9px }
.actions select { font: inherit; font-size: .88rem; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px }
.actions .lbl { font-size: .85rem; color: var(--muted) }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--warn) }
.addrow { padding: 8px }
.ro input.cell, .ro textarea.cell { pointer-events: none }

.placeholder, .loading { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 36px 20px; text-align: center; color: var(--muted) }
/* calendar */
.cal { display: grid; gap: 14px }
.cal-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px }
.cal-nav { display: flex; align-items: center; gap: 8px }
.cal-nav h2 { min-width: 7.5em; text-align: center }
.navbtn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; padding: 0 }
.navbtn:hover:not(:disabled) { border-color: var(--accent) }
.navbtn:disabled { opacity: .35; cursor: default }
.navbtn:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.cal-sum { color: var(--muted); font-size: .88rem }
.cal-sum b { font-family: var(--f-mono); font-weight: 500; color: var(--fg) }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.wd { font-size: .78rem; color: var(--muted); text-align: center; padding-bottom: 2px }
.day { font: inherit; color: inherit; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0; min-height: 96px; display: grid; grid-template-rows: auto 1fr; cursor: pointer; overflow: hidden }
.day:hover { border-color: var(--accent) }
.day.blank { background: transparent; border-style: dashed; cursor: default; opacity: .5 }
.day .dh { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 3px 8px; font-family: var(--f-mono); font-weight: 500; font-size: .92rem }
.day.good .dh { background: var(--ok-soft); color: var(--ok) }
.day.bad .dh { background: var(--warn-soft); color: var(--warn) }
.day .dh .st { font-family: var(--f-body); font-size: .72rem; font-weight: 500 }
.day .db { padding: 4px 8px 6px; font-size: .78rem; color: var(--muted); display: grid; align-content: start; gap: 1px }
.day .db .miss { color: var(--warn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--muted) }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-inline-end: 6px }
details.rules { font-size: .85rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px }
details.rules summary { cursor: pointer; color: var(--fg); font-weight: 500 }
details.rules ul { margin: 8px 0 2px; padding-inline-start: 1.2em; display: grid; gap: 3px }

.overlay { position: fixed; inset: 0; background: rgba(10, 12, 6, .45); display: grid; place-items: center; padding: 16px; z-index: 10 }
.dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px 20px; display: grid; gap: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .25) }
.dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px }
.pill { display: inline-block; font-size: .8rem; font-weight: 500; padding: 2px 10px; border-radius: 10px; margin-inline-start: 8px; vertical-align: 3px }
.pill.good { background: var(--ok-soft); color: var(--ok) }
.pill.bad { background: var(--warn-soft); color: var(--warn) }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px }
.check { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 2px }
.check .k { font-size: .78rem; color: var(--muted) }
.check .v { font-family: var(--f-mono); font-size: 1.05rem }
.check.good .v { color: var(--ok) } .check.bad .v { color: var(--warn) }
.note-bad { color: var(--warn); font-size: .88rem }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; align-items: start }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.grp .gh { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; font-weight: 500 }
.grp.good .gh { background: var(--ok-soft); color: var(--ok) }
.grp.bad .gh { background: var(--warn-soft); color: var(--warn) }
.grp .gc { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.grp ul { list-style: none; margin: 0; padding: 4px 0 }
.grp li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 10px; font-size: .9rem }
.grp li .gt { color: var(--muted); font-size: .78rem; white-space: nowrap }
.grp .gempty { padding: 8px 10px; color: var(--muted); font-size: .85rem }
.dialog table { min-width: 760px }
.dialog td { padding: 6px 8px }
@media (max-width: 640px) {
  .day { min-height: 64px } .day .dh { padding: 2px 5px; font-size: .82rem } .day .dh .st { display: none } .day .db { padding: 2px 5px; font-size: .7rem }
  .grid7 { gap: 3px }
}
@media (max-width: 640px) {
  .panel { padding-inline-start: 0 } h1 { font-size: 1.4rem }
  .reqs-head { display: none }
  .req { grid-template-columns: 1fr }
  .req .ops { justify-content: start }
}
@media (prefers-reduced-motion: reduce) { .tog svg { transition: none } }
</style>

const queues = new Map();

  const prev = queues.get(id) || Promise.resolve();

    cmd: quals.some(q => q === "מכ" || q.includes("קורס מפקדים")) || /^מפקצ|^מפלג|^סמל/.test(plain(s.role)),

// max-flow: people -> slot types (one each) -> required counts; generic soldiers fill the rest
function assignable(people) {
  const generic = TOTAL_NEED - SLOTS.reduce((a, s) => a + s.need, 0);

        h("div", { class: "gh" }, h("span", {}, g.label), h("span", { class: "gc" }, `${people.length} / ${g.need}`)),
        people.length ? h("ul", {}, ...people.map(p => h("li", {}, h("span", {}, p.s.name || "ללא שם"), h("span", { class: "gt" }, teamName(p.s)))))
          : h("div", { class: "gempty" }, "אין אף אחד ביום הזה"));
    })),
    h("h2", { style: "font-size:1.05rem" }, st.absent.length ? `נעדרים (${st.absent.length})` : "אין נעדרים ביום הזה"),
    st.absent.length ? h("div", { class: "ledger" }, h("table", {},
      h("thead", {}, h("tr", {}, ...["שם החייל", "תפקיד", "מ.א", "הכשרות", "צוות", "בקשה"].map(x => h("th", {}, x)))),
      h("tbody", {}, absentRows))) : null].filter(Boolean));
  ov.hidden = false;
  ov.onclick = e => { if (e.target === ov) close() };
  ov.onkeydown = e => { if (e.key === "Escape") close() };
  if (!refresh) dlg.querySelector(".btn")?.focus();
}

/* ---------- offline mode: same interface as the shared store, kept in this browser ---------- */
const LS_KEY = "platoon2-soldiers-v1";
function localCollection(seed) {
  let data = null, listeners = [];
  try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null") } catch (e) {}
  if (!data) data = JSON.parse(JSON.stringify(seed || {}));
  const persist = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(data)) } catch (e) { setStatus("הדפדפן חוסם שמירה. ייצאו גיבוי כדי לא לאבד שינויים.", "err") } };
  const snap = () => { const docs = Object.keys(data).sort().map(id => ({ id, data: () => data[id], metadata: { hasPendingWrites: false } })); return { docs, size: docs.length } };
  const emit = () => listeners.forEach(fn => fn(snap()));
  persist();
  return {
    doc(id) { id = id || "n" + Date.now().toString(36) + uid(); return { id,
      set: async body => { data[id] = JSON.parse(JSON.stringify(body)); persist(); emit() },
      delete: async () => { delete data[id]; persist(); emit() } } },
    onSnapshot(fn) { listeners.push(fn); setTimeout(() => fn(snap()), 0); return () => {} },
    replaceAll(next) { data = next; persist(); emit() },
    all: () => data,
  };
}
/* ---------- shared mode: a Google Sheet behind an Apps Script web app ---------- */
const PASS_KEY = "platoon2-pass";
async function api(pass, body) {
  const res = await fetch(window.P2_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ pass, ...body }) });
  const j = await res.json();
  if (!j.ok) throw Object.assign(new Error(j.error), { code: j.error });
  return j;
}
function remoteCollection(pass, first) {
  let docs = first.docs, rev = first.rev, listeners = [], writeSeq = 0, pending = new Map();
  const snap = () => { const list = Object.keys(docs).sort().map(id => ({ id, data: () => docs[id], metadata: { hasPendingWrites: pending.has(id) } })); return { docs: list, size: list.length } };
  const emit = () => listeners.forEach(fn => fn(snap()));
  const write = async (id, body) => {
    const seq = ++writeSeq; pending.set(id, (pending.get(id) || 0) + 1);
    try { const j = await api(pass, body); if (j.rev != null) rev = Math.max(rev, j.rev) }
    finally { const c = pending.get(id) - 1; c ? pending.set(id, c) : pending.delete(id) }
  };
  let polling = false;
  const poll = async (force) => {
    if (polling || (document.hidden && !force)) return; polling = true;
    const seqAtStart = writeSeq;
    try {
      const r = await api(pass, { action: "rev" });
      if (r.rev !== rev || force) {
        const j = await api(pass, { action: "list" });
        if (writeSeq === seqAtStart && !pending.size) { docs = j.docs; rev = j.rev; emit() }
      }
      if (document.getElementById("status").classList.contains("err")) setStatus("", null);
    } catch (e) { if (e.code === "bad_password") { forgetPass(); location.reload() } else setStatus("אין חיבור לשרת. השינויים יישמרו כשהחיבור יחזור.", "err") }
    finally { polling = false }
  };
  setInterval(poll, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(true) });
  window.addEventListener("focus", () => poll(true));
  return {
    doc(id) { id = id || "n" + Date.now().toString(36) + uid(); return { id,
      set: async body => { docs = { ...docs, [id]: JSON.parse(JSON.stringify(body)) }; emit(); await write(id, { action: "set", id, data: body }) },
      delete: async () => { const { [id]: _, ...rest } = docs; docs = rest; emit(); await write(id, { action: "delete", id }) } } },
    onSnapshot(fn) { listeners.push(fn); setTimeout(() => fn(snap()), 0); return () => {} },
    all: () => docs,
  };
}
function forgetPass() { try { localStorage.removeItem(PASS_KEY) } catch (e) {} }
async function openShared() {
  const box = document.getElementById("loading");
  let saved = null; try { saved = localStorage.getItem(PASS_KEY) } catch (e) {}
  const connect = async pass => {
    let first = await api(pass, { action: "list" });
    if (!Object.keys(first.docs).length) {
      // first run: move the roster into the shared sheet — this browser's edits if it has any, otherwise the original roster
      let initial = null; try { initial = JSON.parse(localStorage.getItem(LS_KEY) || "null") } catch (e) {}
      if (!initial && window.P2_ENC) initial = await decryptRoster(pass);
      if (initial && Object.keys(initial).length) { await api(pass, { action: "seed", docs: initial }); first = await api(pass, { action: "list" }) }
    }
    try { localStorage.setItem(PASS_KEY, pass) } catch (e) {}
    col = remoteCollection(pass, first);
    const bar = document.getElementById("localbar"); bar.hidden = false;
    bar.replaceChildren(
      h("span", { class: "lbl" }, "נתונים משותפים · מתעדכן אוטומטית"),
      h("button", { class: "btn", onclick: () => {
        const blob = new Blob([JSON.stringify(col.all(), null, 1)], { type: "application/json" });
        const a = h("a", { href: URL.createObjectURL(blob), download: `platoon2-backup-${new Date().toISOString().slice(0, 10)}.json` });
        document.body.append(a); a.click(); a.remove(); setStatus("קובץ הגיבוי ירד למחשב", "ok") } }, "ייצוא גיבוי"),
      h("button", { class: "btn", onclick: () => { forgetPass(); location.reload() } }, "התנתקות"));
    subscribe();
  };
  if (saved) { try { return await connect(saved) } catch (e) { if (e.code === "bad_password") forgetPass(); else { box.textContent = "אין חיבור לשרת הנתונים. בדקו את החיבור לאינטרנט ורעננו."; return } } }
  const err = h("div", { style: "color:var(--warn);min-height:1.4em" });
  const pass = h("input", { type: "password", id: "unlock-pass", class: "cell", autocomplete: "current-password", style: "max-width:16em;border-color:var(--line);background:var(--bg)", "aria-label": "סיסמה" });
  const form = h("form", { style: "display:grid;gap:10px;justify-items:center", onsubmit: async e => {
      e.preventDefault(); err.textContent = "מתחבר…";
      try { await connect(pass.value) } catch (x) { err.textContent = x.code === "bad_password" ? "הסיסמה שגויה." : "אין חיבור לשרת הנתונים. נסו שוב." }
    } },
    h("div", { style: "color:var(--fg);font-weight:500" }, "הקלידו את הסיסמה כדי לפתוח את הדשבורד."),
    h("div", { style: "display:flex;gap:8px;flex-wrap:wrap;justify-content:center" }, pass, h("button", { class: "btn primary", type: "submit" }, "פתיחה")),
    err,
    h("div", { style: "font-size:.82rem" }, "הסיסמה נשמרת בדפדפן הזה, ולא תצטרכו להקליד אותה שוב."));
  box.replaceChildren(form); pass.focus();
}

function hasLocal() { try { return !!localStorage.getItem(LS_KEY) } catch (e) { return false } }
async function decryptRoster(pass) {
  const enc = window.P2_ENC, b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(enc.iv) }, key, b(enc.ct))));
}
function openLocal() {
  if (window.P2_SEED || hasLocal()) return startLocal(window.P2_SEED || null);
  const box = document.getElementById("loading");
  if (!window.P2_ENC) { box.textContent = "אין נתונים להצגה."; return }
  const err = h("div", { style: "color:var(--warn);min-height:1.4em" });
  const pass = h("input", { type: "password", id: "unlock-pass", class: "cell", autocomplete: "current-password", style: "max-width:16em;border-color:var(--line);background:var(--bg)", "aria-label": "סיסמה" });
  const form = h("form", { style: "display:grid;gap:10px;justify-items:center", onsubmit: async e => {
      e.preventDefault(); err.textContent = "פותח…";
      try { startLocal(await decryptRoster(pass.value)) } catch (_) { err.textContent = "הסיסמה שגויה." }
    } },
    h("div", { style: "color:var(--fg);font-weight:500" }, "הנתונים מוצפנים. הקלידו את הסיסמה כדי לפתוח."),
    h("div", { style: "display:flex;gap:8px;flex-wrap:wrap;justify-content:center" }, pass, h("button", { class: "btn primary", type: "submit" }, "פתיחה")),
    err,
    h("div", { style: "font-size:.82rem" }, "אחרי הפתיחה הנתונים נשמרים בדפדפן הזה, ולא תצטרכו להקליד שוב."));
  box.replaceChildren(form); pass.focus();
}
function startLocal(seed) {
  col = localCollection(seed);
  document.getElementById("localbar").hidden = false;
  document.getElementById("btn-export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(col.all(), null, 1)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: `platoon2-backup-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove(); setStatus("קובץ הגיבוי ירד למחשב", "ok");
  });
  document.getElementById("file-import").addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (typeof d !== "object" || Array.isArray(d)) throw 0;
      state.open.clear(); state.draft = null; col.replaceAll(d); setStatus("הגיבוי נטען", "ok") } catch (_) { setStatus("הקובץ לא נראה כמו גיבוי של הדשבורד.", "err") }
    e.target.value = "";
  });
  const slot = document.getElementById("reset-slot");
  const drawReset = ask => slot.replaceChildren(ask
    ? h("span", { class: "confirm" }, "למחוק את כל השינויים ולחזור לנתוני המצבה?",
        h("button", { class: "btn danger", onclick: () => {
          if (!seed) { try { localStorage.removeItem(LS_KEY) } catch (e) {} location.reload(); return }
          state.open.clear(); state.draft = null; col.replaceAll(JSON.parse(JSON.stringify(seed))); drawReset(false); setStatus("חזרנו לנתוני המצבה", "ok") } }, "איפוס"),
        h("button", { class: "btn", onclick: () => drawReset(false) }, "ביטול"))
    : h("button", { class: "btn danger", onclick: () => drawReset(true) }, "איפוס לנתוני המצבה"));
  drawReset(false);
  subscribe();
}

/* ---------- boot ---------- */
(async () => {
  if (window.P2_API) return openShared();
  if (!window.claude || !window.claude.use) return openLocal();
  const [dbNs, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!dbNs) {
    if (window.P2_SEED || window.P2_ENC) return openLocal();
    document.getElementById("loading").textContent = "אין גישה לנתוני הפלגה בתצוגה הזו. התחברו לחשבון ונסו שוב."; return;
  }
  db = dbNs; col = db.collection("soldiers");
  if (user) { try { const c = await user.can("data.write"); if (c === false) state.canWrite = false } catch (e) {} }
  subscribe();
})();

function subscribe() {
  col.onSnapshot(snap => {
    const next = new Map();
    for (const d of snap.docs) {
      const data = JSON.parse(JSON.stringify(d.data()));
      const local = state.soldiers.get(d.id);
      // keep this view's local copy while its own write is still in flight
      next.set(d.id, queues.has(d.id) && local && d.metadata.hasPendingWrites ? local : { id: d.id, ...data });
    }
    state.soldiers = next; state.ready = true;
    if (!snap.size) { document.getElementById("loading").textContent = "עדיין אין חיילים ברשימה."; document.getElementById("loading").hidden = false; return }
    requestRender();
  }, () => setStatus("החיבור לנתונים נותק. רעננו את הדף.", "err"));
}
